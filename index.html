<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorenz Baele</title>
<meta name="description" content="Nieuwe website binnenkort.">
<meta name="theme-color" content="#0F0E0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&amp;family=Manrope:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0E0C;
    --text: #F2EDE4;
    --muted: #A8A094;
    --line: #3A362F;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Manrope, system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    text-align: center;
  }
  h1 {
    font-family: "Bodoni Moda", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.5rem, 9vw, 5rem);
    letter-spacing: -0.01em;
    line-height: 1.05;
  }
  p {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <main>
    <h1>Lorenz Baele</h1>
    <p>Nieuwe website binnenkort</p>
  </main>
</body>
</html>
